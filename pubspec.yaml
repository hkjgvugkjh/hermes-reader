name: hermes_reader
description: "hermes-reader — 小方盒管理 + 电子阅读器 + 语音对话终端"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.3
  flutter_markdown: ^0.7.4
  uuid: ^4.5.1
  intl: ^0.20.2
  path_provider: ^2.1.5
  just_audio: ^0.9.39
  flutter_tts: ^4.2.5
  record: ^7.1.1
  flutter_local_notifications: ^17.2.4

  # shared code
  hermes_shared:
    path: ../hermes-shared

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
