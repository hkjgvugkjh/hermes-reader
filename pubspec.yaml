name: hermes_reader
description: "hermes-reader — 小方盒管理 + 电子阅读器 + 语音对话终端"
publish_to: 'none'
version: 1.0.0+2002

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  http: ^1.2.2
  shared_preferences: ^2.3.3
  flutter_markdown: ^0.7.4
  uuid: ^4.5.1
  intl: ^0.20.2
  path_provider: ^2.1.5
  just_audio: ^0.9.39
  flutter_tts: ^4.2.5
  record: ^7.1.1
  flutter_local_notifications: ^17.2.4
  pdf: ^3.10.4
  file_picker: ^8.1.0
  permission_handler: ^11.3.1

  # shared code (published: https://github.com/hkjgvugkjh/hermes-shared)
  hermes_shared:
    path: ../hermes-shared
  archive: ^4.0.9
  gbk_codec: ^0.4.0
  sherpa_onnx: ^1.13.8

  # On-device tiny neural TTS (Ampixa sanoTTS), wired through native FFI.
  sanotts_flutter:
    path: ../sanotts_flutter
  ffi: ^2.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/tts/
    # sanoTTS voice weights (en_us_e12nano.q8.front.bin / .decoder.bin) are
    # dropped here at release time and are git-ignored; the dir is kept so the
    # build stays valid when the blobs are absent.
    - assets/sano/